name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read     # gitleaks lists the PR's commits
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Syntax check
        run: python -m py_compile apps/manager/*.py apps/hub/*.py
      - name: Hub self-test
        run: python apps/hub/test_hub.py
      - name: Shell scripts
        run: shellcheck install.sh apps/hub/vps_setup.sh
      - name: No private keys in the tree
        run: "! git grep -nE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY'"
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
